<section class="grid grid-cols-12 gap-gutter mb-lg items-start">
  <div class="col-span-12 lg:col-span-5 relative group">
    <div
      class="aspect-3/5 overflow-hidden rounded-xl border border-white/10 shadow-2xl"
    >
      <img
        alt="Cyber Rebellion cinematic art"
        class="w-full h-full object-cover"
        data-alt="cinematic widescreen shot of a futuristic neon city street at night with rain reflecting cyan and magenta lights"
        [src]="game()?.cover"
      />
    </div>
  </div>
  <div
    class="absolute inset-0 bg-linear-to-b from-primary/10 via-transparent to-transparent h-200"
  ></div>
  <div class="col-span-12 lg:col-span-7 flex flex-col gap-md">
    <div class="flex items-start justify-between">
      <h2
        class="font-display-xl text-5xl text-foreground bg-transparent leading-none tracking-tighter italic font-bold uppercase"
      >
        {{ game()?.name }}
      </h2>
      <button
        class="w-16 aspect-square rounded-full border border-white/10 flex items-center justify-center hover:text-primary transition-all cursor-pointer z-9"
        type="button"
        title="Edição"
      >
        <ng-icon name="lucideEdit"></ng-icon>
      </button>
    </div>
    <div class="space-y-sm">
      <div class="flex items-center gap-4">
        <span class="text-neutral-500 font-label-sm text-label-sm uppercase"
          >Release Date:</span
        >
        <span class="text-on-background font-stats-md text-stats-md">{{
          game()?.releaseYear
        }}</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-neutral-500 font-label-sm text-label-sm uppercase"
          >Developer:</span
        >
        <span class="text-on-background font-stats-md text-stats-md">{{
          game()?.developer
        }}</span>
      </div>
    </div>
    <div class="flex flex-wrap gap-sm pt-4">
      @for (genre of game()?.genres; track genre) {
        <span
          class="px-3 py-1 bg-primary/10 border border-primary/30 text-primary font-label-sm text-sm rounded uppercase tracking-widest"
          [ngClass]="{
            'bg-secondary/10 border-secondary/30 text-secondary':
              $index % 2 === 0,
          }"
          >{{ genre }}</span
        >
      }
    </div>
    <p class="text-neutral-400 font-body-lg text-lg mt-md">
      {{ game()?.description }}
    </p>
  </div>
</section>
