<div class="flex items-center justify-between mb-8">
  <h2 class="font-headline-lg flex items-center gap-4">
    <span class="w-2 h-8 bg-primary"></span>
    Jogos adquiridos
  </h2>
</div>
<div class="max-w-4xl mx-auto">
  <label for="search-games" class="sr-only">Buscar jogos</label>
  <div class="relative">
    <ng-icon
      name="lucideSearch"
      class="text-xl position-absolute translate-y-9 translate-x-3 text-slate-400"
    />
    <input
      id="search-games"
      type="text"
      placeholder="Buscar jogos..."
      class="w-full border border-primary bg-zinc-900 px-4 py-2 pl-11 text-amber-50 placeholder:text-slate-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary"
    />
  </div>
</div>
<div class="mt-8 mx-auto grid grid-cols-3 sm:grid-cols-1 lg:grid-cols-4 gap-6 mb-16">
  @for (game of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track game) {
    <div
      class="bg-zinc-900 overflow-hidden border border-zinc-800 transition-all duration-300 hover:shadow-(--shadow-primary-hover)"
    >
      <div class="relative">
        <div
          class="absolute bottom-0 left-0 right-0 h-1/3 bg-linear-to-t from-black/80 to-transparent"
        ></div>

        <img
          alt="Game Cover"
          src="https://upload.wikimedia.org/wikipedia/en/0/0c/Witcher_3_cover_art.jpg"
          class="w-full h-100 object-cover"
        />
        <div class="p-4 flex flex-row flex-wrap gap-2 absolute bottom-0 left-0">
          @for (genre of ['Fantasia', 'Ação', 'Aventura', 'RPG']; track genre) {
            <span
              class="border py-1 px-2 rounded-sm text-xs bg-primary/20 border-none text-primary"
              >{{ genre }}</span
            >
          }
        </div>
      </div>
      <div class="p-4">
        <h3 class="font-headline-md text-amber-50 mb-2">The Witcher 3: Wild Hunt</h3>
        <p class="text-sm text-slate-400">Adquirido em: 15 de março de 2024</p>
      </div>
    </div>
  }
</div>
