<header
  class="fixed top-0 w-full z-50 flex flex-start items-center gap-8 px-8 h-16 bg-zinc-950/80 backdrop-blur-xl border-b border-white/10"
>
  <div class="flex items-center gap-8">
    <h1
      class="text-md font-headline-lg font-black text-primary drop-shadow-[0_0_8px_rgba(0,240,255,0.5)] tracking-tighter uppercase"
    >
      {{ projectConfig.platform.name }}
    </h1>
  </div>
  <div class="flex">
    <ul class="flex items-center gap-4">
      <li
        class="p-4 cursor-pointer"
        routerLink="/player/catalog"
        [ngClass]="{ 'text-primary border-b-2 border-primary': isActive('catalog') }"
      >
        Catálogo
      </li>
    </ul>
  </div>
</header>
